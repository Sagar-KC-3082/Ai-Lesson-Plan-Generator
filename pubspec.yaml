name: ai_lesson_plan_generator
description: "AI-powered lesson plan generator for educators"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dartz: ^0.10.1
  dio: ^5.7.0
#  external_path: ^2.2.0
  flutter_riverpod: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  lottie: ^3.2.0
  markdown_widget: ^2.3.2+8
#  path_provider: ^2.1.3
#  pdf: ^3.10.8
#  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 600
